<section class="section bbs" id="bbs">
  <div class="container">
    <header class="section-header reveal">
      <div>
        <p class="eyebrow"><span>09</span><!-- i18n:bbsEyebrow --> CAMPUS BBS / 校園掲示板</p>
        <h2><!-- i18n:bbsTitle1 -->風聲很快，<br><!-- i18n:bbsTitle2 -->但貼文可以慢慢回。</h2>
      </div>
      <p data-i18n="bbsLead">
        課程互助、失物招領、社團募集與校務提案集中於此。
        發言前請確認看板；速報仍請投往新聞學院。
      </p>
    </header>

    <div class="bbs-shell reveal">
      <div class="bbs-toolbar">
        <div class="bbs-filters" role="group" aria-label="BBS 看板" data-i18n-aria-label="attribute.bbsBoards">
          <button class="active" type="button" data-bbs-filter="all" data-i18n="all">全部</button>
          <button type="button" data-bbs-filter="course" data-i18n="course">課程</button>
          <button type="button" data-bbs-filter="club" data-i18n="club">社團</button>
          <button type="button" data-bbs-filter="market" data-i18n="exchange">交換</button>
          <button type="button" data-bbs-filter="notice" data-i18n="campusAffairs">校務</button>
          <button class="bbs-mine-filter" type="button" data-bbs-filter="mine" data-i18n="myBbsPosts">我的貼文</button>
        </div>
        <div class="bbs-toolbar-actions">
          <button class="bbs-shuffle-button" type="button" data-bbs-shuffle data-i18n="shuffleTopics">
            ↻ 換一批話題
          </button>
          <button class="bbs-new-button" type="button" data-bbs-compose data-i18n="newPost">
            ＋ 發布新貼文
          </button>
        </div>
      </div>

      <div class="bbs-table" data-bbs-list aria-live="polite"></div>

      <div class="bbs-status">
        <span data-bbs-online><i></i><!-- i18n:onlineNow --> 目前上線：108</span>
        <span data-bbs-topics data-i18n="topicsToday">今日主題：74</span>
        <span data-bbs-local data-i18n="localBbsCount">本機保存：0 篇</span>
        <span data-bbs-sync data-i18n="lastSync">最後同步：剛剛</span>
      </div>
    </div>
  </div>
</section>
