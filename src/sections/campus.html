<section class="section campus" id="campus">
        <div class="container">
          <header class="section-header reveal">
            <div>
              <p class="eyebrow"><span>08</span><!-- i18n:campusLifeEyebrow --> CAMPUS LIFE / 校園風采</p>
              <h2><!-- i18n:campusLifeTitle1 -->課堂之外，<br><!-- i18n:campusLifeTitle2 -->幻想鄉仍在發生。</h2>
            </div>
            <p data-i18n="campusLead">
              從霧湖自習到妖怪山實作，再到一年一度的符卡燈會。
              校園不是避開差異的結界，而是學習如何一起生活的地方。
            </p>
          </header>

          <div class="campus-gallery">
            <article class="campus-card campus-card-large reveal">
              <img
                src="assets/images/library.webp"
                srcset="assets/images/library-mobile.webp 640w, assets/images/library.webp 1200w"
                sizes="(max-width: 700px) 94vw, 60vw"
                alt="暮色中的霧湖圖書館，長桌、書架與黃銅天球儀被暖光照亮" data-i18n-alt="attribute.warmLightFillsTheLongTablesShelvesAndBrassOrreryOfMistyLakeLibrar"
                loading="lazy"
                width="1200"
                height="900"
              >
              <div>
                <p>01 / STUDY</p>
                <h3 data-i18n="nightLibrary">霧湖圖書館・夜間閱覽</h3>
                <span data-i18n="libraryTagline">館藏會飛，但索書號不會。</span>
                <i aria-hidden="true" data-i18n="viewDetails">查看詳情 ↗</i>
              </div>
              <button class="campus-card-trigger" type="button" data-campus-feature="library" aria-label="查看霧湖圖書館夜間閱覽詳情" data-i18n-aria-label="attribute.viewMistyLakeLibraryNightReadingDetails"></button>
            </article>
            <article class="campus-card reveal">
              <img
                src="assets/images/kappa-lab.webp"
                srcset="assets/images/kappa-lab-mobile.webp 640w, assets/images/kappa-lab.webp 1200w"
                sizes="(max-width: 700px) 94vw, 30vw"
                alt="妖怪山瀑布旁的河童工房，學生正在測試水力機械" data-i18n-alt="attribute.studentsTestHydropowerMachineryAtAKappaWorkshopBesideAYoukaiMount"
                loading="lazy"
                width="1200"
                height="900"
              >
              <div>
                <p>02 / FIELDWORK</p>
                <h3 data-i18n="kappaCampus">妖怪山・河童聯合工房</h3>
                <span data-i18n="designMorning">上午設計，午後下水。</span>
                <i aria-hidden="true" data-i18n="viewDetails">查看詳情 ↗</i>
              </div>
              <button class="campus-card-trigger" type="button" data-campus-feature="workshop" aria-label="查看河童聯合工房詳情" data-i18n-aria-label="attribute.viewKappaJointWorkshopDetails"></button>
            </article>
            <article class="campus-card reveal">
              <img
                src="assets/images/night-festival.webp"
                srcset="assets/images/night-festival-mobile.webp 640w, assets/images/night-festival.webp 1200w"
                sizes="(max-width: 700px) 94vw, 30vw"
                alt="夜間校園燈會，學生在鳥居與櫻花下欣賞符卡形狀的煙火" data-i18n-alt="attribute.studentsWatchSpellCardFireworksBeneathShrineGatesAndCherryTreesAt"
                loading="lazy"
                width="1200"
                height="900"
              >
              <div>
                <p>03 / FESTIVAL</p>
                <h3 data-i18n="springFestival">春季符卡燈會</h3>
                <span data-i18n="festivalRule">彈幕只在天空，攤販留在地上。</span>
                <i aria-hidden="true" data-i18n="viewDetails">查看詳情 ↗</i>
              </div>
              <button class="campus-card-trigger" type="button" data-campus-feature="festival" aria-label="查看春季符卡燈會詳情" data-i18n-aria-label="attribute.viewSpringSpellCardLanternFestivalDetails"></button>
            </article>
          </div>

          <div class="clubs reveal">
            <p class="eyebrow"><span>CLUBS</span><!-- i18n:clubsRegistered --> 本年度登錄社團</p>
            <div class="club-list">
              <button type="button" data-club="grimoire" data-i18n="grimoireClub">魔導書修復會</button>
              <button type="button" data-club="hisoutensoku" data-i18n="hisoutensokuClub">非想天則研究會</button>
              <button type="button" data-club="bamboo" data-i18n="bambooClub">竹林定向部</button>
              <button type="button" data-club="fairyChoir" data-i18n="fairyChoir">妖精合唱團</button>
              <button type="button" data-club="teaNews" data-i18n="teaNewsClub">茶與新聞倫理社</button>
              <button type="button" data-club="nightSparrow" data-i18n="nightSparrowDining">夜雀音樂食堂</button>
              <button type="button" data-club="ufo" data-i18n="ufoClub">不明飛行物觀測會</button>
              <button type="button" data-club="ordinaryMagic" data-i18n="magicClub">普通的魔法實驗社</button>
            </div>
          </div>
        </div>
      </section>
