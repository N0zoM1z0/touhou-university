<section class="section campus-map" id="map">
  <div class="container">
    <header class="section-header reveal">
      <div>
        <p class="eyebrow"><span>06</span> CAMPUS MAP / 校園地圖</p>
        <h2>從博麗門出發，<br>別把近路當成同一條路。</h2>
      </div>
      <p>
        主校區依大結界內側山勢展開。步行時間以人類平均速度計；
        妖精、天狗與間隙移動者請遵守空路分層。
      </p>
    </header>

    <div class="map-layout reveal">
      <section class="map-canvas" aria-label="幻想鄉立東方大學校園地圖">
        <div class="map-terrain map-lake" aria-hidden="true"></div>
        <div class="map-terrain map-forest" aria-hidden="true"></div>
        <div class="map-terrain map-mountain" aria-hidden="true"></div>
        <div class="map-road road-a" aria-hidden="true"></div>
        <div class="map-road road-b" aria-hidden="true"></div>
        <div class="map-road road-c" aria-hidden="true"></div>

        <button class="map-node active" type="button" data-map-place="gate">
          <span>01</span><strong>博麗門</strong>
        </button>
        <button class="map-node" type="button" data-map-place="library">
          <span>02</span><strong>霧湖圖書館</strong>
        </button>
        <button class="map-node" type="button" data-map-place="boundary">
          <span>03</span><strong>境界講堂</strong>
        </button>
        <button class="map-node" type="button" data-map-place="history">
          <span>04</span><strong>稗田史學館</strong>
        </button>
        <button class="map-node" type="button" data-map-place="magic">
          <span>05</span><strong>七曜實驗塔</strong>
        </button>
        <button class="map-node" type="button" data-map-place="clinic">
          <span>06</span><strong>永遠亭診療所</strong>
        </button>
        <button class="map-node" type="button" data-map-place="kappa">
          <span>07</span><strong>河童聯合工房</strong>
        </button>
        <div class="map-compass" aria-hidden="true"><span>北</span><i></i></div>
      </section>

      <aside class="map-detail" aria-live="polite" data-map-detail>
        <div class="map-detail-media">
          <img
            src="assets/images/campus-hero.webp"
            alt="晨霧中的幻想鄉立東方大學主校區與博麗門"
            width="1280"
            height="853"
            loading="lazy"
            data-map-image
          >
          <span data-map-type>迎賓與校務</span>
          <p data-map-index>01 / MAIN GATE</p>
        </div>
        <div class="map-detail-content">
          <h3 data-map-name>博麗門</h3>
          <p data-map-description>
            位於大結界內側的正門。外界生報到、訪客核驗與遺失物返回皆在此辦理。
          </p>
          <dl>
            <div><dt>開放</dt><dd data-map-hours>06:00—22:30</dd></div>
            <div><dt>步行</dt><dd data-map-walk>起點</dd></div>
            <div><dt>空路</dt><dd data-map-air>低空禁飛</dd></div>
          </dl>
          <button class="text-action" type="button" data-service="availability">
            查詢附近館舍 <span aria-hidden="true">→</span>
          </button>
        </div>
      </aside>
    </div>

    <div class="map-legend reveal">
      <span><i class="legend-academic"></i>教學研究</span>
      <span><i class="legend-service"></i>公共服務</span>
      <span><i class="legend-field"></i>實地教學</span>
      <span><i class="legend-restricted"></i>月相管制區</span>
    </div>
  </div>
</section>
